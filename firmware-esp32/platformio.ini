; PlatformIO Project Configuration File
; ESP32-S3 Camera with Arduino Framework

[env:esp32s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- CẤU HÌNH FLASH 16MB (QUAN TRỌNG) ---
board_upload.flash_size = 16MB    ; <--- Bạn bị thiếu dòng này nên nó chặn ở 8MB
board_build.flash_size = 16MB
board_upload.maximum_size = 16777216

; Chọn bảng phân vùng 16MB (chia nhiều cho Spiffs để lưu file)
board_build.partitions = default_16MB.csv

; --- CẤU HÌNH RAM/PSRAM (N16R8 dùng OPI) ---
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags = 
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps = 
    espressif/esp32-camera @ ^2.0.0
    links2004/WebSockets @ ^2.4.1
    earlephilhower/ESP8266Audio @ ^1.9.7
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3